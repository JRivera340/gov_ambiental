server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html,
    # para que React Router maneje la navegación del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre (Vite) — cache agresivo, son inmutables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
