server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html,
    # para que React Router maneje la navegación del lado del cliente.
    # index.html referencia el bundle hasheado del build actual — si el
    # navegador lo cachea, un redeploy no se nota hasta un hard refresh
    # manual (Ctrl+Shift+R). no-cache fuerza a revalidar siempre.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Assets con hash en el nombre (Vite) — cache agresivo, son inmutables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
