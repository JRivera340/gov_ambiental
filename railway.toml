[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migracion automatica en el arranque REVERTIDA 2026-07-31 — ver Dockerfile
# para el detalle. startCommand explicito eliminado para que el CMD del
# Dockerfile mande sin ambiguedad.
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
